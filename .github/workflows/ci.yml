name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-server:
    name: Go Server (vet + integration tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chatlog
          POSTGRES_PASSWORD: chatlog
          POSTGRES_DB: chatlog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatlog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: alpine/minio:latest-release
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        command: server /data --console-address ":9001"
    env:
      TEST_DATABASE_URL: postgres://chatlog:chatlog@localhost:5432/chatlog_test?sslmode=disable
      TEST_DATABASE_URL_HANDLER: postgres://chatlog:chatlog@localhost:5432/chatlog_test?sslmode=disable
      TEST_MINIO_ENDPOINT: localhost:9000
      TEST_MINIO_ACCESS_KEY: minioadmin
      TEST_MINIO_SECRET_KEY: minioadmin
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

  admin-web:
    name: Admin Web (test + lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build