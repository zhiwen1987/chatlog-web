[package]
name = "chatlog-desktop"
version = "0.1.0"
description = "Chatlog Enterprise 桌面客户端"
authors = ["Chatlog Enterprise Team"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "chatlog_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"