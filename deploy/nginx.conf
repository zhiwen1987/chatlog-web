# Chatlog Admin Web — nginx 静态服务（前端 dist + API 反代）
# serve admin-web 构建产物，/api 反向代理到 chatlog-server（docker 网络内）。
# SPA 路由：未匹配静态文件回退 index.html。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip 静态资源
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 带内容 hash 的静态资源长缓存
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反代到 Go server（compose 服务名 chatlog-server，容器 8080）
    location /api/ {
        proxy_pass http://chatlog-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback：未知路径回 index.html（Vue Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }
}